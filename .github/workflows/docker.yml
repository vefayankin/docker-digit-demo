name: Docker build, test & publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 1) Run the tests inside the image: a failing test stops the pipeline
      - name: Test stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Smoke test: start the real container and call the API
      - name: Build serve image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serve
          load: true
          tags: digit-api:ci
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 digit-api:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/sample/0
          curl -sf -X POST localhost:8000/predict \
               -H "Content-Type: application/json" -d @examples/digit.json
          docker logs api

      # 3) Publish to GitHub Container Registry (only on main)
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        if: github.ref == 'refs/heads/main'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Push serve image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serve
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
