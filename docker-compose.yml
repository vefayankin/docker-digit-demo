# api      -> serves whatever model is in the "models" volume
# trainer  -> retrains and writes a new model into the same volume
services:
  api:
    build:
      context: .
      target: serve
    image: digit-api:latest
    ports:
      - "8000:8000"
    volumes:
      - models:/models
    restart: unless-stopped

  trainer:
    build:
      context: .
      target: train
    image: digit-trainer:latest
    command: ["python", "-m", "app.train", "--out", "/models"]
    environment:
      - MODEL_TYPE=rf          # mlp | rf
    volumes:
      - models:/models
    profiles: ["train"]        # runs only with: docker compose run --rm trainer

volumes:
  models:
